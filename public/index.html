<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Web Clone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #d1d7db; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .chat-container { width: 100%; max-width: 450px; height: 100vh; background: #efeae2; display: flex; flex-direction: column; position: relative; }
    @media (min-width: 501px) { .chat-container { height: 90vh; border-radius: 10px; overflow: hidden; } }

    .chat-header { background: #075e54; color: white; padding: 12px 16px; font-weight: bold; font-size: 16px; flex-shrink: 0; }
    
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    /* BUBBLE PESAN */
    .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.15); display: flex; flex-direction: column; cursor: pointer; }
    .message.outgoing { align-self: flex-end; background-color: #d9fdd3; }
    .message.incoming { align-self: flex-start; background-color: #ffffff; }

    /* 1. NAMA DITAMPILKAN DI ATAS PESAN */
    .message-author { font-size: 12px; font-weight: bold; color: #128c7e; margin-bottom: 4px; display: block; }
    .message.outgoing .message-author { color: #005c4b; }

    /* 2. KOTAK BALASAN (REPLY QUOTE) DI DALAM PESAN */
    .reply-quote-box {
      background: rgba(0, 0, 0, 0.07);
      border-left: 4px solid #128c7e;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .reply-quote-author { font-weight: bold; color: #075e54; display: block; margin-bottom: 2px; }
    .reply-quote-content { color: #3b4a54; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

    .message-text { font-size: 14px; color: #111b21; word-break: break-word; }
    .message-time { font-size: 10px; color: #667781; align-self: flex-end; margin-top: 4px; }

    /* PRATINJAU BALASAN DI ATAS INPUT */
    .reply-preview-bar {
      display: none; background: #e2e8f0; padding: 8px 12px; border-left: 4px solid #128c7e;
      justify-content: space-between; align-items: center; font-size: 12px;
    }
    .reply-preview-bar.active { display: flex; }
    .btn-cancel-reply { background: none; border: none; font-weight: bold; cursor: pointer; color: #666; font-size: 14px; }

    /* INPUT FORM */
    .chat-form { display: flex; padding: 8px; background: #f0f2f5; gap: 6px; flex-shrink: 0; }
    .chat-form input { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; outline: none; font-size: 14px; }
    .btn-send { background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 16px; }

    /* MODAL NAMA */
    .modal-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 300px; text-align: center; }
    .modal-box h3 { margin-bottom: 8px; color: #075e54; }
    .modal-box input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .modal-box button { background: #075e54; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Grup WhatsApp</div>
    
    <div class="chat-messages" id="messages"></div>

    <!-- Indicator membalas pesan -->
    <div class="reply-preview-bar" id="replyBar">
      <div>
        <strong id="replyUser" style="color:#075e54; display:block;">-</strong>
        <span id="replyText" style="color:#555;">-</span>
      </div>
      <button class="btn-cancel-reply" id="btnCancelReply">✕</button>
    </div>

    <form class="chat-form" id="form">
      <input type="text" id="input" placeholder="Ketik pesan..." autocomplete="off" />
      <button type="submit" class="btn-send">➤</button>
    </form>
  </div>

  <!-- MODAL NAMA WAJIB INPUT AWAL -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal-box">
      <h3>Masukkan Nama Anda</h3>
      <p style="font-size: 12px; color: #666;">Nama ini akan muncul di atas setiap pesan yang Anda kirim.</p>
      <input type="text" id="nameInput" placeholder="Ketik nama di sini..." maxlength="20" autofocus />
      <button type="button" id="btnSaveName">Mulai Chatting</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // 1. ID UNIK & NAMA PENGGUNA
    let myUserId = sessionStorage.getItem('chat_user_id') || ('id_' + Math.random().toString(36).substr(2, 9));
    sessionStorage.setItem('chat_user_id', myUserId);

    let myUserName = sessionStorage.getItem('chat_username');
    const nameModal = document.getElementById('nameModal');
    const nameInput = document.getElementById('nameInput');
    const btnSaveName = document.getElementById('btnSaveName');

    // Tampilkan modal jika nama belum diisi di sesi ini
    if (!myUserName) {
      nameModal.classList.add('active');
    }

    btnSaveName.addEventListener('click', saveName);
    nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveName(); });

    function saveName() {
      const val = nameInput.value.trim();
      if (val) {
        myUserName = val;
        sessionStorage.setItem('chat_username', val);
        nameModal.classList.remove('active');
      } else {
        alert('Nama tidak boleh kosong!');
      }
    }

    // 2. TAMPILKAN RIWAYAT & PESAN BARU
    const messages = document.getElementById('messages');

    socket.on('load history', (history) => {
      messages.innerHTML = '';
      if (Array.isArray(history)) history.forEach(renderMessage);
    });

    socket.on('chat message', (data) => {
      renderMessage(data);
    });

    // 3. FITUR BALAS PESAN
    let activeReply = null;
    const replyBar = document.getElementById('replyBar');
    const replyUser = document.getElementById('replyUser');
    const replyText = document.getElementById('replyText');
    const btnCancelReply = document.getElementById('btnCancelReply');

    function setReply(senderName, msgText) {
      activeReply = { user: senderName, text: msgText };
      replyUser.textContent = `Membalas: ${senderName}`;
      replyText.textContent = msgText;
      replyBar.classList.add('active');
      document.getElementById('input').focus();
    }

    btnCancelReply.addEventListener('click', () => {
      activeReply = null;
      replyBar.classList.remove('active');
    });

    // 4. KIRIM PESAN
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!myUserName) {
        nameModal.classList.add('active');
        return;
      }

      const text = input.value.trim();
      if (text) {
        socket.emit('chat message', {
          senderId: myUserId,
          senderName: myUserName,
          text: text,
          replyTo: activeReply ? { ...activeReply } : null
        });

        input.value = '';
        activeReply = null;
        replyBar.classList.remove('active');
      }
    });

    // 5. RENDER PESAN KE HAKAMAN CHAT
    function renderMessage(data) {
      if (!data) return;

      const item = document.createElement('div');
      item.classList.add('message');

      const isOutgoing = (data.senderId === myUserId);
      item.classList.add(isOutgoing ? 'outgoing' : 'incoming');

      // (A) NAMA TAMPIL DI ATAS PESAN
      const authorName = data.senderName || 'Pengguna';
      let html = `<span class="message-author">${escapeHtml(authorName)}${isOutgoing ? ' (Anda)' : ''}</span>`;

      // (B) KOTAK KUTIPAN BALASAN (JIKA ADA)
      if (data.replyTo && data.replyTo.user) {
        html += `
          <div class="reply-quote-box">
            <span class="reply-quote-author">↩️ ${escapeHtml(data.replyTo.user)}</span>
            <span class="reply-quote-content">${escapeHtml(data.replyTo.text)}</span>
          </div>
        `;
      }

      // (C) ISI TEKS PESAN
      if (data.text) {
        html += `<div class="message-text">${escapeHtml(data.text)}</div>`;
      }

      html += `<span class="message-time">${data.time || ''}</span>`;
      item.innerHTML = html;

      // KLIK PESAN UNTUK MEMBALAS (REPLY)
      item.addEventListener('click', () => {
        setReply(authorName, data.text || '[Media]');
      });

      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
