<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Web Complete</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #d1d7db; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .chat-container { width: 100%; max-width: 450px; height: 100vh; background: #efeae2; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    @media (min-width: 501px) { .chat-container { height: 90vh; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); } }

    /* HEADER */
    .chat-header { background: #075e54; color: white; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; z-index: 10; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; background: #128c7e; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; color: #fff; }
    .header-info { display: flex; flex-direction: column; }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-status { font-size: 11px; opacity: 0.85; }

    .header-btns { display: flex; gap: 4px; }
    .btn-header { background: none; border: none; font-size: 18px; cursor: pointer; color: white; padding: 6px; border-radius: 50%; transition: 0.2s; }
    .btn-header:hover { background: rgba(255,255,255,0.2); }

    /* BANNER KUNCI CHAT */
    .lock-banner { display: none; background: rgba(18, 140, 126, 0.95); color: white; padding: 8px 14px; font-size: 12px; align-items: center; justify-content: space-between; z-index: 50; }
    .lock-banner.active { display: flex; }
    .btn-unlock { background: #fff; color: #075e54; border: none; padding: 4px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 11px; }

    /* AREA PESAN */
    .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
    
    .message { max-width: 82%; padding: 7px 10px; border-radius: 8px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.12); word-break: break-word; display: flex; flex-direction: column; cursor: pointer; }
    .message.outgoing { align-self: flex-end; background-color: #d9fdd3; border-top-right-radius: 0; }
    .message.incoming { align-self: flex-start; background-color: #ffffff; border-top-left-radius: 0; }

    /* NAMA DI ATAS PESAN */
    .message-author { font-weight: 700; font-size: 12px; margin-bottom: 3px; display: block; color: #128c7e; }
    .message.outgoing .message-author { color: #005c4b; }

    /* KOTAK BALASAN (REPLY QUOTE) */
    .reply-quote-box { background: rgba(0, 0, 0, 0.06); border-left: 4px solid #128c7e; padding: 5px 8px; border-radius: 4px; margin-bottom: 5px; font-size: 11px; }
    .reply-quote-user { font-weight: 700; color: #075e54; display: block; margin-bottom: 2px; }
    .reply-quote-text { color: #3b4a54; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

    .message-text { font-size: 14px; color: #111b21; line-height: 1.4; }
    .message img { max-width: 100%; border-radius: 6px; margin-top: 4px; cursor: pointer; }
    .message audio { max-width: 100%; height: 36px; margin-top: 4px; }
    .file-link { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.05); padding: 6px 10px; border-radius: 6px; text-decoration: none; color: #075e54; font-weight: 500; font-size: 13px; margin-top: 4px; }
    .message-time { font-size: 10px; color: #667781; align-self: flex-end; margin-top: 4px; }

    /* EFEK KUNCI (BLUR) */
    .is-locked .message-text,
    .is-locked .message-author,
    .is-locked .reply-quote-box,
    .is-locked .message img,
    .is-locked .message audio,
    .is-locked .file-link { filter: blur(7px) !important; user-select: none !important; pointer-events: none !important; }

    /* PRATINJAU BALASAN (REPLY BAR ATAS INPUT) */
    .reply-preview-bar { display: none; background: #e2e8f0; padding: 6px 12px; border-left: 4px solid #128c7e; justify-content: space-between; align-items: center; font-size: 12px; }
    .reply-preview-bar.active { display: flex; }
    .btn-cancel-reply { background: none; border: none; font-size: 16px; cursor: pointer; color: #718096; }

    /* INPUT TOOLBAR */
    .chat-form { display: flex; padding: 8px 10px; background: #f0f2f5; align-items: center; gap: 4px; flex-shrink: 0; }
    .btn-action { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .btn-action:hover { background: #e0e0e0; }
    .btn-record.recording { color: red; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .chat-form input[type="text"] { flex: 1; padding: 9px 12px; border: none; border-radius: 20px; outline: none; font-size: 14px; background: #fff; }
    .btn-send { padding: 0; border: none; background: #075e54; color: white; border-radius: 50%; cursor: pointer; width: 38px; height: 38px; font-size: 15px; font-weight: bold; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }

    /* MODAL UMUM */
    .app-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; justify-content: center; align-items: center; padding: 20px; }
    .app-modal.active { display: flex; }
    .modal-card { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .modal-card h3 { font-size: 16px; color: #075e54; }
    .modal-card input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 14px; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-modal { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .btn-modal-primary { background: #075e54; color: white; }
    .btn-modal-secondary { background: #e0e0e0; color: #333; }

    /* MODAL PANGGILAN WEBRTC */
    .call-modal { display: none; position: absolute; inset: 0; background: #111b21; z-index: 200; flex-direction: column; justify-content: space-between; align-items: center; padding: 24px 16px; color: white; }
    .call-modal.active { display: flex; }
    .call-avatar { width: 80px; height: 80px; background: #128c7e; border-radius: 50%; margin: 20px auto 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .video-container { position: relative; width: 100%; flex: 1; margin: 16px 0; background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    video#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    video#localVideo { position: absolute; bottom: 12px; right: 12px; width: 90px; height: 130px; border-radius: 8px; object-fit: cover; border: 2px solid #fff; background: #222; }
    .call-actions { display: flex; gap: 20px; margin-bottom: 20px; }
    .btn-call-ctrl { width: 56px; height: 56px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; color: white; }
    .btn-accept { background-color: #25d366; }
    .btn-decline, .btn-end { background-color: #ea0038; }

    /* MODAL LIVE CAMERA */
    .cam-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 250; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 20px; }
    .cam-modal.active { display: flex; }
    .cam-modal video { width: 100%; max-height: 60%; border-radius: 12px; background: #000; object-fit: cover; }
    .cam-controls { display: flex; gap: 16px; }
    .btn-cam { padding: 10px 20px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-snap { background: #128c7e; color: white; }
    .btn-close-cam { background: #d32f2f; color: white; }
  </style>
</head>
<body>

  <div class="chat-container" id="chatApp">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="avatar">G</div>
        <div class="header-info">
          <div class="header-title">Grup WhatsApp</div>
          <div class="header-status" id="status">Menghubungkan...</div>
        </div>
      </div>
      <!-- Tombol Kunci, Suara, & Video Call -->
      <div class="header-btns">
        <button type="button" class="btn-header" id="btnLock" title="Kunci Chat">🔒</button>
        <button type="button" class="btn-header" id="btnVoiceCall" title="Telepon Suara">📞</button>
        <button type="button" class="btn-header" id="btnVideoCall" title="Panggilan Video">📹</button>
      </div>
    </div>

    <!-- Banner Pemberitahuan Kunci Chat -->
    <div class="lock-banner" id="lockBanner">
      <span>🔒 Pesan Terkunci & Disensor</span>
      <button class="btn-unlock" id="btnUnlock">🔓 Buka Kunci</button>
    </div>

    <!-- Area Tampilan Chat -->
    <div class="chat-messages" id="messages"></div>

    <!-- Indicator Reply Bar di Atas Input -->
    <div class="reply-preview-bar" id="replyPreview">
      <div>
        <strong id="replyPreviewUser" style="color:#128c7e; display:block;">Balas Pesan</strong>
        <span id="replyPreviewText" style="color:#4a5568;">-</span>
      </div>
      <button type="button" class="btn-cancel-reply" id="btnCancelReply">✕</button>
    </div>

    <!-- Form Input & Toolbar Media -->
    <form class="chat-form" id="form">
      <input type="file" id="fileInput" hidden accept="*/*" />
      <input type="file" id="imageInput" hidden accept="image/*" />

      <!-- 6 Fitur Media Toolbar -->
      <button type="button" class="btn-action" id="btnAttach" title="Kirim File">📁</button>
      <button type="button" class="btn-action" id="btnGallery" title="Kirim Gambar">🖼️</button>
      <button type="button" class="btn-action" id="btnLiveCam" title="Kamera Live">📸</button>
      <button type="button" class="btn-action btn-record" id="btnMic" title="Pesan Suara">🎤</button>

      <input id="input" type="text" autocomplete="off" placeholder="Ketik pesan..." />
      <button type="submit" class="btn-send" title="Kirim">➤</button>
    </form>

    <!-- 1. MODAL INPUT NAMA WAJIB PERTAMA KALI -->
    <div class="app-modal" id="nameModal">
      <div class="modal-card">
        <h3>Selamat Datang! 👋</h3>
        <p style="font-size: 12px; color: #666;">Masukkan nama Anda untuk mulai mengobrol:</p>
        <input type="text" id="usernameInput" placeholder="Ketik nama Anda..." maxlength="20" autofocus />
        <div class="modal-btns">
          <button type="button" class="btn-modal btn-modal-primary" id="btnSaveName">Simpan & Masuk</button>
        </div>
      </div>
    </div>

    <!-- MODAL KUNCI CHAT & PASSWORD -->
    <div class="app-modal" id="passwordModal">
      <div class="modal-card">
        <h3 id="pwdModalTitle">Buka Kunci Chat 🔓</h3>
        <p id="pwdModalDesc" style="font-size: 12px; color: #666;">Masukkan password untuk membuka sensor:</p>
        <input type="password" id="passwordInput" placeholder="Masukkan password..." />
        <div class="modal-btns">
          <button type="button" class="btn-modal btn-modal-secondary" id="btnCancelPwd">Batal</button>
          <button type="button" class="btn-modal btn-modal-primary" id="btnSubmitPwd">Konfirmasi</button>
        </div>
      </div>
    </div>

    <!-- MODAL TELEPON & VIDEO CALL WEBRTC -->
    <div class="call-modal" id="callModal">
      <div class="call-info">
        <div class="call-avatar" id="callAvatar">📞</div>
        <h3 id="callTitle">Panggilan Suara</h3>
        <p id="callStatusText" style="font-size: 13px; color: #8696a0; margin-top: 4px;">Memanggil...</p>
      </div>

      <div class="video-container" id="videoContainer" style="display: none;">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>

      <div class="call-actions">
        <button type="button" class="btn-call-ctrl btn-accept" id="btnAcceptCall" style="display: none;">📞</button>
        <button type="button" class="btn-call-ctrl btn-decline" id="btnDeclineCall" style="display: none;">❌</button>
        <button type="button" class="btn-call-ctrl btn-end" id="btnEndCall" style="display: none;">📵</button>
      </div>
    </div>

    <!-- MODAL LIVE CAMERA -->
    <div class="cam-modal" id="camModal">
      <video id="webcam" autoplay playsinline></video>
      <div class="cam-controls">
        <button type="button" class="btn-cam btn-snap" id="btnSnap">Ambil Foto</button>
        <button type="button" class="btn-cam btn-close-cam" id="btnCloseCam">Tutup</button>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chatApp = document.getElementById('chatApp');
    const status = document.getElementById('status');
    const messages = document.getElementById('messages');

    // 1. INPUT NAMA WAJIB PERTAMA KALI OPEN (Pakai sessionStorage agar selalu minta per tab/sesi baru)
    let myUserId = sessionStorage.getItem('chat_user_id') || ('id_' + Math.random().toString(36).substr(2, 9));
    sessionStorage.setItem('chat_user_id', myUserId);

    let myUserName = sessionStorage.getItem('chat_username');
    const nameModal = document.getElementById('nameModal');
    const usernameInput = document.getElementById('usernameInput');
    const btnSaveName = document.getElementById('btnSaveName');

    if (!myUserName) {
      nameModal.classList.add('active');
    }

    btnSaveName.addEventListener('click', saveUsername);
    usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveUsername(); });

    function saveUsername() {
      const val = usernameInput.value.trim();
      if (val) {
        myUserName = val;
        sessionStorage.setItem('chat_username', val);
        nameModal.classList.remove('active');
      } else {
        alert('Nama pengguna wajib diisi!');
      }
    }

    // 2. KONEKSI SOCKET.IO & LOADER
    socket.on('connect', () => { status.textContent = "online"; });
    socket.on('disconnect', () => { status.textContent = "terputus"; });

    socket.on('load history', (history) => {
      messages.innerHTML = '';
      if (Array.isArray(history)) history.forEach(renderMessage);
    });

    socket.on('chat message', (data) => {
      renderMessage(data);
    });

    // 3. FITUR BALAS PESAN (REPLY QUOTE)
    let activeReply = null;
    const replyPreview = document.getElementById('replyPreview');
    const replyPreviewUser = document.getElementById('replyPreviewUser');
    const replyPreviewText = document.getElementById('replyPreviewText');
    const btnCancelReply = document.getElementById('btnCancelReply');

    function setReplyMessage(userName, textContent) {
      activeReply = { user: userName, text: textContent };
      replyPreviewUser.textContent = `Membalas ${userName}`;
      replyPreviewText.textContent = textContent || '[Media]';
      replyPreview.classList.add('active');
      document.getElementById('input').focus();
    }

    btnCancelReply.addEventListener('click', () => {
      activeReply = null;
      replyPreview.classList.remove('active');
    });

    // FORM KIRIM PESAN TEKS
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!myUserName) { nameModal.classList.add('active'); return; }

      const text = input.value.trim();
      if (text) {
        socket.emit('chat message', {
          senderId: myUserId,
          senderName: myUserName,
          text: text,
          replyTo: activeReply ? { ...activeReply } : null
        });
        input.value = '';
        activeReply = null;
        replyPreview.classList.remove('active');
      }
    });

    // 4. FITUR KUNCI CHAT & PASSWORD
    const btnLock = document.getElementById('btnLock');
    const btnUnlock = document.getElementById('btnUnlock');
    const lockBanner = document.getElementById('lockBanner');
    const passwordModal = document.getElementById('passwordModal');
    const passwordInput = document.getElementById('passwordInput');
    const pwdModalTitle = document.getElementById('pwdModalTitle');
    const pwdModalDesc = document.getElementById('pwdModalDesc');
    const btnSubmitPwd = document.getElementById('btnSubmitPwd');
    const btnCancelPwd = document.getElementById('btnCancelPwd');

    btnLock.addEventListener('click', () => {
      chatApp.classList.add('is-locked');
      lockBanner.classList.add('active');
    });

    btnUnlock.addEventListener('click', () => {
      const savedPwd = localStorage.getItem('chat_password');
      pwdModalTitle.textContent = savedPwd ? "Buka Kunci Chat 🔓" : "Set Password Kunci 🔒";
      pwdModalDesc.textContent = savedPwd ? "Masukkan password untuk membuka sensor:" : "Buat password baru untuk menyensor chat:";
      passwordInput.value = '';
      passwordModal.classList.add('active');
      passwordInput.focus();
    });

    btnCancelPwd.addEventListener('click', () => passwordModal.classList.remove('active'));
    btnSubmitPwd.addEventListener('click', handlePassword);
    passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handlePassword(); });

    function handlePassword() {
      const enteredPwd = passwordInput.value.trim();
      const savedPwd = localStorage.getItem('chat_password');

      if (!enteredPwd) { alert('Password wajib diisi!'); return; }

      if (!savedPwd) {
        localStorage.setItem('chat_password', enteredPwd);
        alert('Password berhasil disimpan!');
        chatApp.classList.remove('is-locked');
        lockBanner.classList.remove('active');
        passwordModal.classList.remove('active');
      } else if (enteredPwd === savedPwd) {
        chatApp.classList.remove('is-locked');
        lockBanner.classList.remove('active');
        passwordModal.classList.remove('active');
      } else {
        alert('Password salah!');
      }
    }

    // 5. FITUR KIRIM FILE & KIRIM GAMBAR
    const btnAttach = document.getElementById('btnAttach');
    const fileInput = document.getElementById('fileInput');
    btnAttach.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        socket.emit('chat message', {
          file: evt.target.result,
          fileName: file.name,
          senderId: myUserId,
          senderName: myUserName || 'Pengguna',
          replyTo: activeReply ? { ...activeReply } : null
        });
        fileInput.value = '';
        activeReply = null;
        replyPreview.classList.remove('active');
      };
      reader.readAsDataURL(file);
    });

    const btnGallery = document.getElementById('btnGallery');
    const imageInput = document.getElementById('imageInput');
    btnGallery.addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        socket.emit('chat message', {
          image: evt.target.result,
          senderId: myUserId,
          senderName: myUserName || 'Pengguna',
          replyTo: activeReply ? { ...activeReply } : null
        });
        imageInput.value = '';
        activeReply = null;
        replyPreview.classList.remove('active');
      };
      reader.readAsDataURL(file);
    });

    // 6. FITUR KAMERA LIVE
    const btnLiveCam = document.getElementById('btnLiveCam');
    const camModal = document.getElementById('camModal');
    const webcam = document.getElementById('webcam');
    const btnSnap = document.getElementById('btnSnap');
    const btnCloseCam = document.getElementById('btnCloseCam');
    const canvas = document.getElementById('canvas');
    let streamTrack = null;

    btnLiveCam.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        webcam.srcObject = stream;
        streamTrack = stream;
        camModal.classList.add('active');
      } catch (err) {
        alert('Akses kamera gagal: ' + err.message);
      }
    });

    btnSnap.addEventListener('click', () => {
      canvas.width = webcam.videoWidth;
      canvas.height = webcam.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg');
      
      socket.emit('chat message', {
        image: imageData,
        senderId: myUserId,
        senderName: myUserName || 'Pengguna',
        replyTo: activeReply ? { ...activeReply } : null
      });

      closeCamera();
      activeReply = null;
      replyPreview.classList.remove('active');
    });

    btnCloseCam.addEventListener('click', closeCamera);
    function closeCamera() {
      if (streamTrack) streamTrack.getTracks().forEach(t => t.stop());
      camModal.classList.remove('active');
    }

    // 7. FITUR PESAN SUARA (VOICE NOTE)
    const btnMic = document.getElementById('btnMic');
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    btnMic.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (evt) => {
              socket.emit('chat message', {
                audio: evt.target.result,
                senderId: myUserId,
                senderName: myUserName || 'Pengguna',
                replyTo: activeReply ? { ...activeReply } : null
              });
              activeReply = null;
              replyPreview.classList.remove('active');
            };
            reader.readAsDataURL(audioBlob);
            stream.getTracks().forEach(t => t.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          btnMic.classList.add('recording');
        } catch (err) {
          alert('Mikrofon tidak diizinkan: ' + err.message);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btnMic.classList.remove('recording');
      }
    });

    // RENDER SEMUA JENIS PESAN DI CHAT BUBBLE
    function renderMessage(data) {
      if (!data) return;

      const item = document.createElement('div');
      item.classList.add('message');

      const isOutgoing = (data.senderId === myUserId);
      item.classList.add(isOutgoing ? 'outgoing' : 'incoming');

      const authorName = data.senderName || 'Pengguna';

      // (A) NAMA DITAMPILKAN DI ATAS PESAN
      let contentHtml = `<span class="message-author">${escapeHtml(authorName)}${isOutgoing ? ' (Anda)' : ''}</span>`;

      // (B) KOTAK BALASAN (REPLY QUOTE)
      if (data.replyTo && data.replyTo.user) {
        contentHtml += `
          <div class="reply-quote-box">
            <span class="reply-quote-user">↩️ ${escapeHtml(data.replyTo.user)}</span>
            <span class="reply-quote-text">${escapeHtml(data.replyTo.text)}</span>
          </div>
        `;
      }

      // (C) ISI PESAN KONTEN
      if (data.text) contentHtml += `<div class="message-text">${escapeHtml(data.text)}</div>`;
      if (data.image) contentHtml += `<img src="${data.image}" onclick="event.stopPropagation(); window.open(this.src)" title="Klik untuk memperbesar" />`;
      if (data.audio) contentHtml += `<audio controls src="${data.audio}"></audio>`;
      if (data.file) contentHtml += `<a class="file-link" href="${data.file}" download="${escapeHtml(data.fileName || 'file')}">📄 ${escapeHtml(data.fileName || 'Download File')}</a>`;

      contentHtml += `<span class="message-time">${data.time || ''}</span>`;
      item.innerHTML = contentHtml;

      // Klik bubble pesan untuk membalas (Reply)
      item.addEventListener('click', (e) => {
        if (['A', 'IMG', 'AUDIO'].includes(e.target.tagName)) return;
        const summary = data.text || (data.image ? '[Foto]' : data.audio ? '[Voice Note]' : data.file ? '[File]' : '[Pesan]');
        setReplyMessage(authorName, summary);
      });

      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 8. WEBRTC PANGGILAN SUARA & VIDEO CALL
    const btnVoiceCall = document.getElementById('btnVoiceCall');
    const btnVideoCall = document.getElementById('btnVideoCall');
    const callModal = document.getElementById('callModal');
    const callAvatar = document.getElementById('callAvatar');
    const callTitle = document.getElementById('callTitle');
    const callStatusText = document.getElementById('callStatusText');
    const videoContainer = document.getElementById('videoContainer');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const btnAcceptCall = document.getElementById('btnAcceptCall');
    const btnDeclineCall = document.getElementById('btnDeclineCall');
    const btnEndCall = document.getElementById('btnEndCall');

    let peerConnection = null;
    let localStream = null;
    let targetSocketId = null;
    let pendingOffer = null;
    let activeCallType = 'voice';

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    btnVoiceCall.addEventListener('click', () => startCall('voice'));
    btnVideoCall.addEventListener('click', () => startCall('video'));

    async function startCall(type) {
      activeCallType = type;
      showCallUI(type, 'Memanggil...', true);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: (type === 'video'), audio: true });
        if (type === 'video') { localVideo.srcObject = localStream; videoContainer.style.display = 'flex'; }

        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', { offer, callType: type, user: myUserName });
      } catch (err) {
        alert('Gagal memulai panggilan: ' + err.message);
        endCallLogic();
      }
    }

    socket.on('call-made', (data) => {
      targetSocketId = data.from;
      pendingOffer = data.offer;
      activeCallType = data.callType;
      showIncomingCallUI(data.user, data.callType);
    });

    socket.on('answer-made', async (data) => {
      targetSocketId = data.from;
      callStatusText.textContent = "Terhubung";
      if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection && data.candidate) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
      }
    });

    socket.on('call-rejected', () => { alert('Panggilan ditolak'); endCallLogic(); });
    socket.on('call-ended', () => { endCallLogic(); });

    btnAcceptCall.addEventListener('click', async () => {
      btnAcceptCall.style.display = 'none';
      btnDeclineCall.style.display = 'none';
      btnEndCall.style.display = 'flex';
      callStatusText.textContent = "Terhubung";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: (activeCallType === 'video'), audio: true });
        if (activeCallType === 'video') { localVideo.srcObject = localStream; videoContainer.style.display = 'flex'; }

        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('make-answer', { answer, to: targetSocketId });
      } catch (err) {
        alert('Gagal menerima panggilan: ' + err.message);
        endCallLogic();
      }
    });

    btnDeclineCall.addEventListener('click', () => {
      socket.emit('reject-call', { to: targetSocketId });
      endCallLogic();
    });

    btnEndCall.addEventListener('click', () => {
      socket.emit('end-call', { to: targetSocketId });
      endCallLogic();
    });

    function createPeerConnection() {
      const pc = new RTCPeerConnection(rtcConfig);
      pc.onicecandidate = (e) => {
        if (e.candidate && targetSocketId) socket.emit('ice-candidate', { candidate: e.candidate, to: targetSocketId });
      };
      pc.ontrack = (e) => {
        remoteVideo.srcObject = e.streams[0];
        if (activeCallType === 'video') videoContainer.style.display = 'flex';
      };
      return pc;
    }

    function showCallUI(type, statusTxt, isCaller) {
      callModal.classList.add('active');
      callTitle.textContent = (type === 'video') ? 'Panggilan Video' : 'Panggilan Suara';
      callAvatar.textContent = (type === 'video') ? '📹' : '📞';
      callStatusText.textContent = statusTxt;
      videoContainer.style.display = 'none';
      btnAcceptCall.style.display = 'none';
      btnDeclineCall.style.display = 'none';
      btnEndCall.style.display = isCaller ? 'flex' : 'none';
    }

    function showIncomingCallUI(username, type) {
      callModal.classList.add('active');
      callTitle.textContent = username;
      callAvatar.textContent = (type === 'video') ? '📹' : '📞';
      callStatusText.textContent = `Panggilan ${type === 'video' ? 'Video' : 'Suara'} Masuk...`;
      videoContainer.style.display = 'none';
      btnAcceptCall.style.display = 'flex';
      btnDeclineCall.style.display = 'flex';
      btnEndCall.style.display = 'none';
    }

    function endCallLogic() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      callModal.classList.remove('active');
      videoContainer.style.display = 'none';
      targetSocketId = null;
      pendingOffer = null;
    }
  </script>
</body>
</html>
